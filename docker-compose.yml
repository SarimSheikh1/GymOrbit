services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymorbit
      POSTGRES_USER: gymorbit
      POSTGRES_PASSWORD: gymorbit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymorbit -d gymorbit"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
